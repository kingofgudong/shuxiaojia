    &lt;title&gt;蓝色小象的彩色石子桥&lt;/title&gt;
    &lt;!-- Tailwind CSS --&gt;
    &lt;script src=&quot;https://metis-online.fbcontent.cn/metis-misc/zgLDUdmazTYc0B4K6Cor.js&quot;&gt;&lt;/script&gt;
    &lt;!-- Anime.js --&gt;
    &lt;script src=&quot;https://metis-online.fbcontent.cn/metis-misc/zZZY40t7WJC7UdQCPACm.js&quot;&gt;&lt;/script&gt;
    &lt;style&gt;
        :root {
            --primary: #A7DBA8;
            --secondary: #D8FBF7;
            --accent-red: #FF6421;
            --accent-yellow: #FFD700;
        }
        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background-color: #F0F9FF;
            overflow: hidden;
            touch-action: none;
        }
        .river-bg {
            background-image: linear-gradient(to bottom, rgba(255,255,255,0.15), rgba(0,0,0,0.08)), url('https://musk-online.fbcontent.cn/pub-musk-ai-studio/workflow/file/picture/MFXU55uccFfQ32vra9rj9n.jpg');
            background-size: cover;
            background-position: center;
            height: 50vh; /* 从 55vh 降低到 50vh，上移 5% */
            min-height: 280px;
            position: relative;
            border-bottom: 8px solid #81D4FA;
            overflow: hidden;
            box-shadow: inset 0 -20px 40px rgba(129, 212, 250, 0.4);
        }
        /* 毛玻璃标题栏 */
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        /* 交互涟漪效果 */
        .ripple-effect {
            position: absolute;
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            pointer-events: none;
            transform: scale(0);
            opacity: 1;
            z-index: 5;
        }
        /* 岸边小草 */
        .grass {
            position: absolute;
            bottom: 0;
            width: 4px;
            height: 20px;
            background: #4CAF50;
            border-radius: 2px;
            transform-origin: bottom;
            animation: sway 3s infinite ease-in-out;
            z-index: 3;
        }
        @keyframes sway {
            0%, 100% { transform: rotate(-5deg); }
            50% { transform: rotate(5deg); }
        }
        /* 动态水波纹效果 */
        .river-bg::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at 50% 50%, rgba(255,255,255,0.2) 0%, transparent 60%);
            opacity: 0.4;
            animation: ripple 8s infinite alternate ease-in-out;
            pointer-events: none;
        }
        @keyframes ripple {
            0% { transform: scale(1) translate(-2%, -2%); }
            100% { transform: scale(1.1) translate(2%, 2%); }
        }
        /* 漂浮的云朵 */
        .cloud {
            position: absolute;
            background: white;
            border-radius: 50px;
            opacity: 0.6;
            filter: blur(10px);
            pointer-events: none;
            z-index: 2;
        }
        .cloud-1 { width: 120px; height: 40px; top: 15%; left: -150px; animation: floatCloud 25s infinite linear; }
        .cloud-2 { width: 180px; height: 60px; top: 25%; left: -200px; animation: floatCloud 35s infinite linear 5s; }
        @keyframes floatCloud {
            to { left: 110%; }
        }
        .boar {
            width: 120px;
            height: 120px;
            background-image: url('https://musk-online.fbcontent.cn/pub-musk-ai-studio/workflow/file/picture/9MmdUv8g8PNxeU9fDNo93A.jpg');
            background-size: contain;
            background-repeat: no-repeat;
            position: fixed;
            bottom: auto;
            top: 50%;
            left: -150px;
            z-index: 50;
            pointer-events: none;
            border-radius: 20px;
        }
        .stone {
            width: 100%;
            height: 100%;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));
            transition: transform 0.2s;
            touch-action: none;
        }
        /* 备选区的容器需要固定大小，或者也跟随响应式 */
        .stone-wrapper {
            width: 75px;
            height: 55px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .stone:active {
            transform: scale(1.1);
        }
        .stone-red {
            background-image: url('https://musk-online.fbcontent.cn/pub-musk-ai-studio/workflow/file/picture/xmMTL2xuje8pJZgDvEoabg.jpg');
        }
        .stone-yellow {
            background-image: url('https://musk-online.fbcontent.cn/pub-musk-ai-studio/workflow/file/picture/Eep2Dkb5rknrTnEADfC5Na.jpg');
        }
        .stone-blue {
            background-image: url('https://musk-online.fbcontent.cn/pub-musk-ai-studio/workflow/file/picture/xmMTL2xuje8pJZgDvEoabg.jpg');
            filter: hue-rotate(200deg);
        }
        #bridge {
            display: flex !important;
            flex-direction: row !important;
            flex-wrap: nowrap !important;
            align-items: center;
            justify-content: center;
            gap: 2px;
            margin: 60px auto 0;
            padding: 0 5px;
            width: 98% !important;
            max-width: 98vw !important;
            box-sizing: border-box !important;
            overflow: visible !important;
        }
        .slot, .river-bg .stone {
            flex: 1 1 0% !important;
            min-width: 0 !important;
            width: 0 !important;
            height: auto !important;
            aspect-ratio: 75 / 55 !important;
            max-width: 75px !important;
            box-sizing: border-box !important;
        }
        .slot {
            border: 2px dashed rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.2);
        }
        #bridge::-webkit-scrollbar { display: none; }
        
        /* 适配极小屏 */
        @media (max-height: 600px) {
            .river-bg { height: 50vh; }
            .inventory { height: 50vh !important; padding: 5px !important; gap: 8px !important; }
            h1 { font-size: 1.25rem !important; }
            .stone { width: 60px; height: 45px; }
            .slot { width: 65px; height: 50px; }
        }
        .dragging {
            position: fixed;
            z-index: 1000;
            pointer-events: none;
        }
        .success-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255,255,255,0.3);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            pointer-events: none;
        }
        .inventory {
            height: 50vh; /* 从 45vh 增加到 50vh，确保内容有足够空间展现 */
            min-height: 220px;
            background: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start; /* 改为靠顶对齐，配合 padding 控制整体上移感 */
            gap: 12px; /* 稍微压缩间距 */
            padding: 15px 10px;
            width: 100%;
            box-sizing: border-box;
            text-align: center;
        }
        .draggable-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
            width: 100%;
        }
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background: #f00;
        }
    &lt;/style&gt;

            &lt;div class=&quot;stone-wrapper&quot;&gt;&lt;div class=&quot;stone stone-red&quot; data-type=&quot;red&quot; id=&quot;source-red&quot;&gt;&lt;/div&gt;&lt;/div&gt;
            &lt;div class=&quot;stone-wrapper&quot;&gt;&lt;div class=&quot;stone stone-yellow&quot; data-type=&quot;yellow&quot; id=&quot;source-yellow&quot;&gt;&lt;/div&gt;&lt;/div&gt;
            &lt;div class=&quot;stone-wrapper&quot;&gt;&lt;div class=&quot;stone stone-blue&quot; data-type=&quot;blue&quot; id=&quot;source-blue&quot;&gt;&lt;/div&gt;&lt;/div&gt;

    &lt;audio id=&quot;audio-success&quot; src=&quot;&quot;&gt;&lt;/audio&gt;

    &lt;script&gt;
        const bridgeContainer = document.getElementById('bridge');
        let currentLevel = 1;
        const maxLevels = 10;
        let pattern = [];
        let missingIndices = [];
        let filledCount = 0;
        let isDragging = false;
        let currentDraggingEl = null;
        let dragType = '';

        function generateLevel(level) {
            const types = ['red', 'yellow', 'blue'];
            // 恢复固定的关卡长度逻辑，不因为手机端而减项
            let len = 6 + Math.floor(level / 2); 
            pattern = [];
            
            if (level &lt;= 4) {
                // 1-4关：ABAB
                for (let i = 0; i &lt; len; i++) {
                    pattern.push(types[i % 2]);
                }
            } else if (level &lt;= 6) {
                // 5-6关：ABBABB
                const base = ['red', 'yellow', 'yellow'];
                for (let i = 0; i &lt; len; i++) {
                    pattern.push(base[i % 3]);
                }
            } else if (level &lt;= 8) {
                // 7-8关：ABCABC
                for (let i = 0; i &lt; len; i++) {
                    pattern.push(types[i % 3]);
                } 
            } else {
                // 9-10关：进阶 AABB
                const base = ['red', 'red', 'yellow', 'yellow'];
                for (let i = 0; i &lt; len; i++) {
                    pattern.push(base[i % 4]);
                }
            }

            // 随机缺失位置
            missingIndices = [];
            const numMissing = level &lt;= 4 ? 2 : 3;
            while (missingIndices.length &lt; numMissing) {
                let idx = Math.floor(Math.random() * (len - 2)) + 1;
                if (!missingIndices.includes(idx)) missingIndices.push(idx);
            }
            missingIndices.sort((a, b) =&gt; a - b);
        }

        function initGame() {
            generateLevel(currentLevel);
            document.getElementById('level-indicator').innerText = `第 ${currentLevel} / ${maxLevels} 关`;
            
            bridgeContainer.innerHTML = '';
            filledCount = 0;
            const boar = document.getElementById('boar');
            boar.style.left = '-150px';
            boar.style.display = 'block';

            if (currentLevel === 1) {
                document.getElementById('audio-welcome').play().catch(() =&gt; {});
            }
            
            pattern.forEach((type, index) =&gt; {
                if (missingIndices.includes(index)) {
                    const slot = document.createElement('div');
                    slot.className = 'slot';
                    slot.dataset.index = index;
                    slot.dataset.expected = type;
                    bridgeContainer.appendChild(slot);
                } else {
                    const stone = document.createElement('div');
                    stone.className = `stone stone-${type}`;
                    bridgeContainer.appendChild(stone);
                }
            });

            // 入场动画
            anime({
                targets: '.stone',
                translateY: [-50, 0],
                opacity: [0, 1],
                delay: anime.stagger(100),
                easing: 'easeOutElastic(1, .6)'
            });
        }

        // 拖拽逻辑实现
        function handleStart(e) {
            // 必检 #16: 状态守卫
            if (isDragging) {
                if (currentDraggingEl) currentDraggingEl.remove();
                isDragging = false;
            }

            const target = e.target.closest('.stone');
            if (!target || !target.id.startsWith('source')) return;

            // 防止触摸时触发滚动
            if (e.type === 'touchstart') e.preventDefault();

            isDragging = true;
            dragType = target.dataset.type;
            
            const rect = target.getBoundingClientRect();
            // 必检 #6: 记录 offset 避免瞬移
            const clientX = e.clientX || (e.touches &amp;&amp; e.touches[0].clientX);
            const clientY = e.clientY || (e.touches &amp;&amp; e.touches[0].clientY);
            target._dragOffset = {
                x: clientX - rect.left,
                y: clientY - rect.top
            };

            // 必检 #10: fixed 挂到 body
            currentDraggingEl = target.cloneNode(true);
            currentDraggingEl.classList.add('dragging');
            
            // 响应式核心：读取当前河中 slot 的实时尺寸并应用到拖拽物上
            const referenceSlot = document.querySelector('.slot');
            if (referenceSlot) {
                const slotSize = referenceSlot.getBoundingClientRect();
                currentDraggingEl.style.width = slotSize.width + 'px';
                currentDraggingEl.style.height = slotSize.height + 'px';
            }
            
            document.body.appendChild(currentDraggingEl);
            
            // 必检 #4: setPointerCapture (由于是克隆节点，直接在克隆节点上处理 move/up 更稳)
            if (e.pointerId !== undefined) {
                currentDraggingEl.setPointerCapture(e.pointerId);
            }
            
            moveAt(e);
        }

        function moveAt(e) {
            if (!isDragging || !currentDraggingEl) return;
            const clientX = e.clientX || (e.touches &amp;&amp; e.touches[0].clientX);
            const clientY = e.clientY || (e.touches &amp;&amp; e.touches[0].clientY);
            const rect = currentDraggingEl.getBoundingClientRect();
            const offset = {
                x: rect.width / 2,
                y: rect.height / 2
            };
            
            // 必检 #5: 坐标计算
            currentDraggingEl.style.left = (clientX - offset.x) + 'px';
            currentDraggingEl.style.top = (clientY - offset.y) + 'px';
        }

        function handleEnd(e) {
            if (!isDragging) return;
            isDragging = false;

            // 必检 #14: 异步前抓局部引用
            const dragEl = currentDraggingEl;
            const type = dragType;

            const slots = document.querySelectorAll('.slot');
            let droppedOnSlot = null;

            // 必检 #8: 矩形判定用 elementFromPoint (简单且兼容性好)
            // 暂时隐藏自己以检测下方元素
            dragEl.style.pointerEvents = 'none';
            const clientX = e.clientX || (e.changedTouches &amp;&amp; e.changedTouches[0].clientX);
            const clientY = e.clientY || (e.changedTouches &amp;&amp; e.changedTouches[0].clientY);
            const hit = document.elementFromPoint(clientX, clientY);
            droppedOnSlot = hit ? hit.closest('.slot') : null;
            dragEl.style.pointerEvents = 'auto';

            if (droppedOnSlot &amp;&amp; !droppedOnSlot.hasChildNodes()) {
                if (type === droppedOnSlot.dataset.expected) {
                    handleSuccess(droppedOnSlot, type);
                } else {
                    handleError(droppedOnSlot);
                }
            }

            if (dragEl &amp;&amp; dragEl.parentNode) {
                document.body.removeChild(dragEl);
            }
            currentDraggingEl = null;
        }

        function handleSuccess(slot, type) {
            slot.innerHTML = `&lt;div class=&quot;stone stone-${type}&quot;&gt;&lt;/div&gt;`;
            slot.style.border = 'none';
            slot.style.background = 'none';
            filledCount++;
            
            document.getElementById('audio-success').play();
            
            anime({
                targets: slot.firstChild,
                scale: [0.5, 1],
                rotate: '1turn',
                duration: 800
            });

            if (filledCount === missingIndices.length) {
                setTimeout(startBoarAnimation, 800);
            }
        }

        function handleError(slot) {
            anime({
                targets: slot,
                translateX: [10, -10, 10, -10, 0],
                duration: 400,
                easing: 'linear'
            });
        }

        function startBoarAnimation() {
            showSuccessEffect();
            const boar = document.getElementById('boar');
            const stones = document.querySelectorAll('#bridge &gt; div');
            const timeline = anime.timeline({
                easing: 'easeOutQuad'
            });

            // 初始位置：第一块石头左侧
            const firstRect = stones[0].getBoundingClientRect();
            boar.style.display = 'block';
            boar.style.left = (firstRect.left - 120) + 'px';
            boar.style.top = (firstRect.top - 60) + 'px';
            // 确保初始朝向向右
            boar.style.transform = 'scaleX(-1)';

            // 依次跳向每一块石头
            stones.forEach((stone, index) =&gt; {
                const rect = stone.getBoundingClientRect();
                const targetX = rect.left + rect.width / 2 - 50;
                const targetY = rect.top - 60;

                timeline.add({
                    targets: '#boar',
                    left: targetX,
                    top: targetY,
                    scaleX: -1,
                    duration: 450,
                    begin: function() {
                        createRipple(targetX + 50, targetY + 100);
                        anime({
                            targets: '#boar',
                            translateY: [0, -50, 0],
                            duration: 450,
                            easing: 'easeOutQuad'
                        });
                    }
                });
            });

            // 走过河岸
            timeline.add({
                targets: '#boar',
                left: window.innerWidth + 150,
                scaleX: -1,
                duration: 1000,
                easing: 'linear',
                complete: function() {
                    if (currentLevel &lt; maxLevels) {
                        currentLevel++;
                        initGame();
                    } else {
                        alert('太棒了！你完成了所有关卡！');
                        currentLevel = 1;
                        initGame();
                    }
                }
            });
        }

        function createRipple(x, y) {
            const ripple = document.createElement('div');
            ripple.className = 'ripple-effect';
            ripple.style.left = x + 'px';
            ripple.style.top = y + 'px';
            ripple.style.width = '100px';
            ripple.style.height = '40px';
            document.querySelector('.river-bg').appendChild(ripple);

            anime({
                targets: ripple,
                scale: [0, 1.5],
                opacity: [1, 0],
                duration: 800,
                easing: 'easeOutQuart',
                complete: () =&gt; ripple.remove()
            });
        }

        function showSuccessEffect() {
            const overlay = document.getElementById('success-overlay');
            overlay.style.display = 'flex';
            
            // 简单的纸屑效果
            for(let i=0; i&lt;30; i++) {
                createConfetti();
            }

            setTimeout(() =&gt; {
                overlay.style.display = 'none';
            }, 2000);
        }

        function createConfetti() {
            const colors = ['#FF6421', '#FFD700', '#4CAF50', '#2196F3'];
            const el = document.createElement('div');
            el.className = 'confetti';
            el.style.left = Math.random() * 100 + 'vw';
            el.style.top = '-10px';
            el.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            document.body.appendChild(el);

            anime({
                targets: el,
                top: '100vh',
                left: `+=${(Math.random() - 0.5) * 200}px`,
                rotate: '2turn',
                duration: 1000 + Math.random() * 1000,
                easing: 'linear',
                complete: () =&gt; el.remove()
            });
        }

        function resetGame() {
            currentLevel = 1;
            initGame();
        }

        // 事件监听：必检 #1 统一使用 Pointer Events 配合 touch-action
        // 必检 #15: document 委托
        document.addEventListener('pointerdown', handleStart);
        document.addEventListener('pointermove', moveAt);
        document.addEventListener('pointerup', handleEnd);
        document.addEventListener('pointercancel', handleEnd); // 必检 #11

        // 保留对 touchstart 的 preventDefault 处理，以防在某些浏览器中 setPointerCapture 覆盖不全
        document.addEventListener('touchstart', (e) =&gt; {
            if (e.target.closest('.stone')) e.preventDefault();
        }, { passive: false });

        // 初始化
        initGame();
    &lt;/script&gt;

  <script>

    function getIsMobile() {
      const width = document.documentElement.clientWidth
      const isMobile = /Android|webOS|iPhone|iPod|BlackBerry|iPad|Windows Phone|Mobile/i.test(navigator.userAgent) || width <= 768
      return isMobile
    }

    // 打开飞象老师官网
    function openFeixiangTeacher(event) {
      const isMobile = getIsMobile()

      // 判断是否为移动端浏览器
      if (isMobile) {
        // 移动端不跳转
        return
      }
      window.open('https://www.feixianglaoshi.com', '_blank')
    }


    // ==================== 埋点相关代码 ====================

    /**
     * 页面停留时长统计
     */
    (function () {
      let startTime = null
      let totalTime = 0
      let reportTimer = null // 防抖定时器

      // 开始计时
      function startTimer() {
        if (!startTime) {
          startTime = Date.now()
          console.log('[埋点] 开始计时')
        }
      }

      // 停止计时并累加时长
      function stopTimer() {
        if (startTime) {
          totalTime += Date.now() - startTime
          startTime = null
          console.log('[埋点] 停止计时，累计时长:', Math.floor(totalTime / 1000), '秒')
        }
      }

      // 检查页面是否真正可见
      function isPageVisible() {
        // 检查 document.hidden
        if (document.hidden) {
          return false
        }

        // 检查 document.visibilityState
        if (document.visibilityState && document.visibilityState !== 'visible') {
          return false
        }

        // 检查窗口是否有焦点
        if (!document.hasFocus()) {
          return false
        }

        return true
      }

      // 上报停留时长（带防抖）
      function reportStayTime(eventType, immediate = false) {
        stopTimer()

        // 清除之前的定时器
        if (reportTimer) {
          clearTimeout(reportTimer)
          reportTimer = null
        }

        // 如果是立即上报（如页面卸载），不使用防抖
        if (immediate) {
          doReport(eventType)
          return
        }

        // 使用防抖，避免短时间内多次上报
        // 100ms 内如果有多个事件触发，只上报最后一次
        reportTimer = setTimeout(function () {
          doReport(eventType)
          reportTimer = null
        }, 100)
      }

      // 实际执行上报
      function doReport(eventType) {
        if (window.frog && totalTime > 0) {
          const serverData = window.__SERVER_DATA__ || {}
          const chatId = serverData.watermarkChatId
          window.frog.add({
            url: '/time/HtmlPage/enter',
            eventId: 42818,
            customExtend: {
              chat_id: chatId,
              use_time: Math.floor(totalTime / 1000), // 转换为秒
            },
            duration: Math.floor(totalTime / 1000), // 转换为秒,
            currentPage: 'HtmlPage',
            eventAction: 'time',
            eventName: 'enter'
          })
          console.log(`[埋点] 页面停留时长上报 (${eventType}):`, Math.floor(totalTime / 1000), '秒')

          // 上报后重置累计时长，为下次统计做准备
          totalTime = 0
        }
      }

      // 清理函数：移除所有事件监听器
      function cleanup() {
        console.log('[埋点] 清理计时器资源')

        // 清除防抖定时器
        if (reportTimer) {
          clearTimeout(reportTimer)
          reportTimer = null
        }

        // 移除事件监听器
        document.removeEventListener('visibilitychange', handleVisibilityChange)
        window.removeEventListener('blur', handleBlur)
        window.removeEventListener('focus', handleFocus)
        window.removeEventListener('beforeunload', handleBeforeUnload)
        window.removeEventListener('pagehide', handlePageHide)

        // 重置变量
        startTime = null
        totalTime = 0
      }

      // 事件处理函数（需要命名以便移除）
      function handleVisibilityChange() {
        if (document.hidden) {
          // 页面不可见，停止计时并上报
          console.log('[埋点] visibilitychange - 页面隐藏')
          reportStayTime('visibilitychange')
        } else {
          // 页面可见，开始新的计时
          console.log('[埋点] visibilitychange - 页面显示，开始新的计时')
          startTimer()
        }
      }

      function handleBlur() {
        // 窗口失去焦点，停止计时并上报
        console.log('[埋点] blur - 窗口失去焦点')
        reportStayTime('blur')
      }

      function handleFocus() {
        // 窗口获得焦点，开始新的计时
        console.log('[埋点] focus - 窗口获得焦点，开始新的计时')
        startTimer()
      }

      function handleBeforeUnload() {
        // 页面卸载前立即上报（不使用防抖）
        console.log('[埋点] beforeunload - 页面即将卸载')
        reportStayTime('beforeunload', true)
        cleanup()
      }

      function handlePageHide() {
        // 页面隐藏时立即上报（iOS Safari 更可靠，不使用防抖）
        console.log('[埋点] pagehide - 页面隐藏')
        reportStayTime('pagehide', true)
      }

      function handleDOMContentLoaded() {
        if (isPageVisible()) {
          startTimer()
        }
      }

      // 监听页面可见性变化
      document.addEventListener('visibilitychange', handleVisibilityChange)

      // 监听窗口失去/获得焦点
      window.addEventListener('blur', handleBlur)
      window.addEventListener('focus', handleFocus)

      // 页面加载完成后开始计时
      if (document.readyState === 'loading') {
        window.addEventListener('DOMContentLoaded', handleDOMContentLoaded)
      } else {
        if (isPageVisible()) {
          startTimer()
        }
      }

      // 页面卸载时上报
      window.addEventListener('beforeunload', handleBeforeUnload)

      // 兼容性：监听 pagehide 事件（iOS Safari 更可靠）
      window.addEventListener('pagehide', handlePageHide)
    })()

    /**
     * 点击飞象老师 Logo 的埋点
     */
    function trackLogoClick(event) {
      // 阻止事件冒泡，避免触发 HTML 点击埋点
      event.stopPropagation()

      if (window.frog) {
        const serverData = window.__SERVER_DATA__ || {}
        const chatId = serverData.watermarkChatId
        console.log('trackHtmlClick', chatId)

        window.frog.add({
          url: '/click/HtmlPage/logo',
          eventId: 42816,
          customExtend: {
            chat_id: chatId,
          },
          currentPage: 'HtmlPage',
          eventAction: 'click',
          eventName: 'logo'
        })

        console.log('[埋点] 点击飞象老师 Logo')
      }
    }

    /**
     * 点击立即体验的埋点
     */
    function trackStartButtonClick(event) {
      // 阻止事件冒泡，避免触发 HTML 点击埋点
      event.stopPropagation()

      if (window.frog) {
        const serverData = window.__SERVER_DATA__ || {}
        const chatId = serverData.watermarkChatId
        console.log('trackHtmlClick', chatId)
        window.frog.add({
          url: '/click/HtmlPage/start',
          eventId: 42817,
          customExtend: {
            chat_id: chatId
          },
          currentPage: 'HtmlPage',
          eventAction: 'click',
          eventName: 'start'
        })
        console.log('[埋点] 点击立即体验')
      }
    }

    // 绑定点击事件
    document.addEventListener('DOMContentLoaded', function () {
      // 绑定 Logo 点击埋点和跳转功能
      const logoElement = document.querySelector('.left-watermark-content')
      if (logoElement) {
        logoElement.addEventListener('click', function (event) {
          trackLogoClick(event)
          openFeixiangTeacher(event)
        })
      }

      // 绑定立即体验按钮点击埋点和跳转功能
      const startButton = document.querySelector('.jump-button')
      if (startButton) {
        startButton.addEventListener('click', function (event) {
          trackStartButtonClick(event)
          openFeixiangTeacher(event)
        })
      }

      // 绑定水印覆盖层点击（整体区域）
      const watermarkOverlay = document.querySelector('.watermark-overlay')
      if (watermarkOverlay) {
        watermarkOverlay.addEventListener('click', function (event) {
          // 如果点击的不是 logo 或按钮，则触发跳转
          const target = event.target
          const isLogo = target.closest('.left-watermark-content')
          const isButton = target.closest('.jump-button')

          if (!isLogo && !isButton) {
            openFeixiangTeacher(event)
          }
        })
      }
    })

    // ==================== 原有功能代码 ====================

    function adjustRem() {
      const pcBaseWidth = 375 // 设计稿
      const width = document.documentElement.clientWidth
      document.documentElement.style.fontSize = `${(width / pcBaseWidth * 100).toFixed(2)}px`
    }


    // 移动端检测和按钮隐藏逻辑
    function checkAndHideButtonOnMobile() {
      const isMobile = getIsMobile()
      if (isMobile) {
        adjustRem()
      }
      const jumpButton = document.querySelector('.right-watermark-content .jump-button');
      const iframeContainer = document.querySelector('.iframe-container');

      if (isMobile && jumpButton) {
        jumpButton.style.display = 'none';
      } else {
        jumpButton.style.display = 'flex'
      }

      // 移动端时给iframe-container添加类名，否则移除类名
      if (iframeContainer) {
        if (isMobile) {
          iframeContainer.classList.add('mobile');
        } else {
          iframeContainer.classList.remove('mobile');
        }
      }
    }


    function handleResize() {
      // 响应式处理：重新检测移动端并处理按钮显示/隐藏
      checkAndHideButtonOnMobile();

      // 在窗口大小变化时，重新应用移动端相关的逻辑
      const isMobile = getIsMobile()
      const watermarkOverlay = document.querySelector('.watermark-overlay');
      const iframeContainer = document.querySelector('.iframe-container');

      // 根据当前设备类型调整水印覆盖层的点击行为
      if (watermarkOverlay) {
        if (isMobile) {
          // 移动端：移除点击事件或设置为空函数
          watermarkOverlay.onclick = function () {
            // 移动端不执行跳转
            return;
          };
        } else {
          // 桌面端：恢复正常的点击跳转功能
          watermarkOverlay.onclick = openFeixiangTeacher;
        }
      }

      // 确保在resize时也能正确添加或移除mobile类
      if (iframeContainer) {
        if (isMobile) {
          iframeContainer.classList.add('mobile');
        } else {
          iframeContainer.classList.remove('mobile');
        }
      }
    }

    // 防止iframe内容溢出
    window.addEventListener('resize', handleResize);

    // 页面加载完成后执行移动端检测
    document.addEventListener('DOMContentLoaded', checkAndHideButtonOnMobile);

    // 清理所有事件绑定的函数
    function clearAllEvents() {
      // 清除 resize 事件监听器
      window.removeEventListener('resize', handleResize);

      // 清除 DOMContentLoaded 事件监听器
      document.removeEventListener('DOMContentLoaded', checkAndHideButtonOnMobile);
    }

    // 页面卸载时自动清理事件（可选）
    window.addEventListener('beforeunload', clearAllEvents);

  </script>
