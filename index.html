<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <meta name="theme-color" content="#7568f5">
  <title>数小嘉动画小课堂</title>
  <link rel="icon" type="image/webp" href="shuxiaojia-avatar.webp">
  <link rel="preload" as="image" href="shuxiaojia-avatar.webp" type="image/webp">
  <link rel="preload" as="audio" href="animation_int.mp3" type="audio/mpeg">
  <style>
    :root {
      --purple:#7568f5;
      --purple-dark:#5548d8;
      --yellow:#ffd45b;
      --mint:#65d6b4;
      --ink:#3d3858;
      --muted:#8d879f;
      --white:#fff;
      --shadow:0 18px 45px rgba(60,47,139,.18);
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      overflow:hidden;
      color:var(--ink);
      font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
      background:linear-gradient(145deg,#ddd8ff,#fff3bf);
      -webkit-tap-highlight-color:transparent;
    }
    button{border:0;font:inherit;cursor:pointer}
    .app{
      position:relative;
      width:min(100%,480px);
      height:100dvh;
      min-height:560px;
      margin:auto;
      overflow:hidden;
      background:
        radial-gradient(circle at 12% 19%,rgba(255,255,255,.9) 0 4px,transparent 5px),
        radial-gradient(circle at 87% 25%,rgba(255,255,255,.9) 0 3px,transparent 4px),
        linear-gradient(165deg,#eeebff 0%,#faf9ff 52%,#fff4c8 100%);
      box-shadow:0 0 55px rgba(48,38,106,.18);
    }
    .header{
      display:flex;
      align-items:center;
      gap:10px;
      min-height:70px;
      padding:max(11px,env(safe-area-inset-top)) 13px 11px;
      color:#fff;
      background:linear-gradient(135deg,#7166ee,#887efb);
      box-shadow:0 5px 17px rgba(76,62,179,.2);
    }
    .back-top{
      display:grid;
      grid-template-columns:auto auto;
      align-items:center;
      gap:2px;
      flex:0 0 auto;
      padding:8px 10px 8px 7px;
      border:1px solid rgba(255,255,255,.42);
      border-radius:12px;
      color:#fff;
      background:rgba(255,255,255,.14);
      font-size:11px;
      font-weight:800;
    }
    .back-top b{font-size:23px;line-height:14px}
    .avatar{width:43px;height:43px;overflow:hidden;border:2px solid rgba(255,255,255,.75);border-radius:14px;background:#fff}
    .avatar img{width:100%;height:100%;object-fit:cover;object-position:center 39%}
    .header-copy{flex:1;min-width:0}.header h1{margin:0;font-size:17px}.header p{margin:3px 0 0;font-size:10px;opacity:.86}
    .content{height:calc(100% - 70px);overflow-y:auto;padding:15px 16px max(20px,env(safe-area-inset-bottom));}
    .teacher-tip{display:flex;align-items:flex-start;gap:9px;margin-bottom:12px;padding:10px 12px;border:1px solid #e3defd;border-radius:16px;background:rgba(255,255,255,.9);box-shadow:0 6px 16px rgba(68,53,143,.07)}
    .teacher-tip img{width:38px;height:38px;object-fit:cover;object-position:center 39%;border-radius:12px}
    .teacher-tip p{margin:0;font-size:13px;line-height:1.65}
    .card{position:relative;overflow:hidden;border:4px solid #fff;border-radius:26px;background:#fff;box-shadow:var(--shadow)}
    .start-panel{position:absolute;z-index:20;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:25px;background:linear-gradient(160deg,rgba(239,235,255,.97),rgba(255,247,210,.97));text-align:center;transition:.35s}
    .start-panel.hide{opacity:0;visibility:hidden;transform:scale(1.05)}
    .start-panel img{width:92px;height:92px;object-fit:cover;object-position:center 39%;border:5px solid #fff;border-radius:28px;box-shadow:0 10px 22px rgba(63,51,143,.18)}
    .start-panel h2{margin:2px 0 0;font-size:19px}.start-panel p{margin:0;color:var(--muted);font-size:11px}
    .start-panel .load-status{min-height:20px;color:#6e65a0;font-size:12px;font-weight:800}
    .start-panel .load-status.error{color:#d94f60}
    .start-panel button{padding:13px 28px;border-radius:16px;color:#fff;background:linear-gradient(135deg,#7e72f8,#574bd0);box-shadow:0 9px 19px rgba(77,63,199,.25);font-weight:900}
    .start-panel button:disabled{cursor:wait;opacity:.62;box-shadow:none}
    .title{padding:16px 45px 6px;text-align:center;font-size:19px;font-weight:900}
    .subtitle{margin:0 15px 7px;color:var(--muted);text-align:center;font-size:11px}
    .stage{position:relative;height:270px;margin:5px 12px 0;overflow:hidden;border-radius:21px;background:linear-gradient(145deg,#e9e4ff,#fff0ad)}
    .group{position:absolute;top:48px;display:grid;grid-template-columns:repeat(2,45px);justify-items:center;gap:4px;width:96px;transition:transform .8s ease}
    .group.left{left:24px}.group.right{right:24px}
    .apple{display:block;font-size:38px;font-style:normal;filter:drop-shadow(0 4px 3px rgba(102,67,42,.16));opacity:0;transform:translateY(-23px) scale(.5)}
    .apple:nth-child(3){grid-column:1/3}
    .plus{position:absolute;left:50%;top:74px;color:var(--purple-dark);font-size:35px;font-weight:900;opacity:0;transform:translateX(-50%) scale(.5)}
    .result{position:absolute;left:50%;top:35px;display:grid;grid-template-columns:repeat(3,48px);justify-items:center;gap:8px 5px;opacity:0;transform:translateX(-50%) scale(.7)}
    .result i{font-size:39px;font-style:normal;filter:drop-shadow(0 4px 3px rgba(102,67,42,.16))}
    .count{position:absolute;left:50%;bottom:72px;display:flex;gap:6px;transform:translateX(-50%);opacity:0}
    .count i{display:grid;width:25px;height:25px;place-items:center;border-radius:50%;color:#fff;background:var(--purple);font-size:11px;font-style:normal;font-weight:900;opacity:.35}
    .equation{position:absolute;left:50%;bottom:18px;width:max-content;padding:9px 18px;border-radius:999px;color:#fff;background:linear-gradient(135deg,#7d71f8,#574bd0);box-shadow:0 7px 16px rgba(83,70,203,.23);font-size:18px;font-weight:900;opacity:0;transform:translate(-50%,12px)}
    .stage.playing .group .apple{animation:appleIn .55s ease forwards}
    .stage.playing .group.left .apple:nth-child(1){animation-delay:5.4s}.stage.playing .group.left .apple:nth-child(2){animation-delay:6.3s}.stage.playing .group.left .apple:nth-child(3){animation-delay:7.2s}
    .stage.playing .group.right .apple:nth-child(1){animation-delay:10.1s}.stage.playing .group.right .apple:nth-child(2){animation-delay:11s}.stage.playing .group.right .apple:nth-child(3){animation-delay:11.9s}
    .stage.playing .plus{animation:pop .5s 13.1s ease forwards,fade .35s 16.45s forwards}
    .stage.playing .group.left{animation:mergeLeft 1.6s 14.35s ease forwards,fade .4s 16.45s forwards}
    .stage.playing .group.right{animation:mergeRight 1.6s 14.35s ease forwards,fade .4s 16.45s forwards}
    .stage.playing .result{animation:resultIn .75s 16.9s ease forwards}
    .stage.playing .count{animation:show .25s 17.8s forwards}
    .stage.playing .count i{animation:countPop .45s ease forwards}.stage.playing .count i:nth-child(1){animation-delay:18.1s}.stage.playing .count i:nth-child(2){animation-delay:18.7s}.stage.playing .count i:nth-child(3){animation-delay:19.3s}.stage.playing .count i:nth-child(4){animation-delay:19.9s}.stage.playing .count i:nth-child(5){animation-delay:20.5s}.stage.playing .count i:nth-child(6){animation-delay:21.1s}
    .stage.playing .equation{animation:equationIn .65s 22.5s ease forwards}
    .stage.paused,.stage.paused *{animation-play-state:paused!important}
    .stage.paused::after{content:"声音缓冲中…";position:absolute;z-index:8;left:50%;top:50%;padding:8px 14px;border-radius:999px;color:#fff;background:rgba(85,72,216,.9);box-shadow:0 6px 14px rgba(55,44,142,.2);font-size:12px;font-weight:900;transform:translate(-50%,-50%)}
    @keyframes appleIn{to{opacity:1;transform:translateY(0) scale(1)}}
    @keyframes pop{70%{opacity:1;transform:translateX(-50%) scale(1.25)}100%{opacity:1;transform:translateX(-50%) scale(1)}}
    @keyframes mergeLeft{to{transform:translateX(65px) scale(.86)}}@keyframes mergeRight{to{transform:translateX(-65px) scale(.86)}}
    @keyframes fade{to{opacity:0}}@keyframes show{to{opacity:1}}
    @keyframes resultIn{0%{opacity:0;transform:translateX(-50%) scale(.6)}70%{opacity:1;transform:translateX(-50%) scale(1.12)}100%{opacity:1;transform:translateX(-50%) scale(1)}}
    @keyframes countPop{60%{opacity:1;transform:scale(1.25)}100%{opacity:1;transform:scale(1);background:#ff8663}}
    @keyframes equationIn{to{opacity:1;transform:translate(-50%,0)}}
    .conclusion{margin:12px 16px 8px;padding:11px 12px;border-radius:14px;color:#5c5573;background:#f3f0ff;text-align:center;font-size:13px;font-weight:800;line-height:1.65;opacity:0;transform:translateY(8px);transition:.35s}
    .conclusion.show{opacity:1;transform:translateY(0)}
    .actions{display:grid;grid-template-columns:.9fr 1.25fr;gap:8px;padding:7px 15px 15px;opacity:0;transform:translateY(8px);transition:.35s}
    .actions.show{opacity:1;transform:translateY(0)}
    .replay{padding:13px 8px;border:2px solid #dcd7fb;border-radius:14px;color:#584fba;background:#fff;font-size:12px;font-weight:900}
    .return-button{padding:13px 8px;border-radius:14px;color:#fff;background:linear-gradient(135deg,#6ed9ba,#3caf8d);box-shadow:0 7px 15px rgba(47,166,132,.22);font-size:12px;font-weight:900}
    .footer-note{margin:10px 0 0;color:#9c97aa;text-align:center;font-size:9px}
    @media(min-width:560px){body{padding:18px 0}.app{height:calc(100dvh - 36px);border:7px solid #2d2947;border-radius:31px}}
    @media(max-height:680px){.content{padding-top:9px}.teacher-tip{margin-bottom:7px;padding-block:7px}.stage{height:225px}.group{top:31px}.plus{top:56px}.result{top:22px}.title{padding-top:10px}.conclusion{margin-top:7px;padding-block:7px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0ms!important}}
  </style>
</head>
<body>
  <main class="app">
    <header class="header">
      <button class="back-top return-to-coze" type="button"><b>‹</b><span>返回</span></button>
      <div class="avatar"><img src="shuxiaojia-avatar.webp" alt="数小嘉" width="240" height="240"></div>
      <div class="header-copy"><h1>数小嘉动画小课堂</h1><p>用苹果看懂 3＋3</p></div>
    </header>
    <section class="content">
      <div class="teacher-tip"><img src="shuxiaojia-avatar.webp" alt="数小嘉" width="240" height="240"><p>没关系，我们把两组苹果放在一起，慢慢数一数吧！</p></div>
      <article class="card">
        <div id="startPanel" class="start-panel">
          <img src="shuxiaojia-avatar.webp" alt="数小嘉" width="240" height="240">
          <h2>苹果动画准备中</h2>
          <p id="loadStatus" class="load-status" role="status" aria-live="polite">正在准备动画和声音…</p>
          <button id="startPlayButton" type="button" disabled>资源加载中…</button>
        </div>
        <div class="title">我们用苹果来理解 3＋3</div>
        <p class="subtitle">三颗红苹果，加上三颗绿苹果</p>
        <div id="stage" class="stage">
          <div class="group left"><i class="apple">🍎</i><i class="apple">🍎</i><i class="apple">🍎</i></div>
          <div class="plus">＋</div>
          <div class="group right"><i class="apple">🍏</i><i class="apple">🍏</i><i class="apple">🍏</i></div>
          <div class="result"><i>🍎</i><i>🍎</i><i>🍎</i><i>🍏</i><i>🍏</i><i>🍏</i></div>
          <div class="count"><i>1</i><i>2</i><i>3</i><i>4</i><i>5</i><i>6</i></div>
          <div class="equation">3 ＋ 3 ＝ 6</div>
        </div>
        <div id="conclusion" class="conclusion">3 个苹果＋3 个苹果＝6 个苹果，所以 3＋3＝6。</div>
        <div id="actions" class="actions">
          <button id="replayButton" class="replay" type="button">↻ 重新播放</button>
          <button class="return-button return-to-coze" type="button">返回数小嘉</button>
        </div>
      </article>
      <p class="footer-note">请等待资源准备完成，再点击播放动画</p>
    </section>
  </main>
  <audio id="narration" preload="auto" playsinline webkit-playsinline></audio>
  <script>
    // 扣子公开体验地址。无法返回上一页时，会打开此链接。
    const COZE_URL = "https://www.coze.cn/store/agent/7653366365516185650?bot_id=true";

    const AUDIO_URL = "animation_int.mp3";
    const AVATAR_URL = "shuxiaojia-avatar.webp";
    const RESOURCE_TIMEOUT = 12000;
    const stage = document.getElementById("stage");
    const conclusion = document.getElementById("conclusion");
    const actions = document.getElementById("actions");
    const startPanel = document.getElementById("startPanel");
    const startTitle = startPanel.querySelector("h2");
    const loadStatus = document.getElementById("loadStatus");
    const startPlayButton = document.getElementById("startPlayButton");
    const narration = document.getElementById("narration");
    let audioContext;
    let audioObjectUrl="";
    let activeSoundNodes=[];
    let resourcesReady=false;
    let preparingResources=false;
    let playPending=false;

    function stopAnimationSounds(){
      activeSoundNodes.forEach(node=>{try{node.stop()}catch{}});
      activeSoundNodes=[];
    }

    function createTone(frequency,start,duration=.12,volume=.055,type="sine"){
      const oscillator=audioContext.createOscillator();
      const gain=audioContext.createGain();
      oscillator.type=type;
      oscillator.frequency.setValueAtTime(frequency,start);
      oscillator.frequency.exponentialRampToValueAtTime(frequency*1.16,start+duration);
      gain.gain.setValueAtTime(.0001,start);
      gain.gain.exponentialRampToValueAtTime(volume,start+.018);
      gain.gain.exponentialRampToValueAtTime(.0001,start+duration);
      oscillator.connect(gain).connect(audioContext.destination);
      oscillator.start(start);
      oscillator.stop(start+duration+.02);
      activeSoundNodes.push(oscillator);
    }

    function playAnimationSounds(fromTime=0){
      try{
        audioContext=audioContext||new(window.AudioContext||window.webkitAudioContext)();
        audioContext.resume().then(()=>{
          stopAnimationSounds();
          const now=audioContext.currentTime+.04;
          const appleTimes=[5.4,6.3,7.2,10.1,11,11.9];
          const appleNotes=[590,640,690,740,790,850];
          appleTimes.forEach((time,index)=>{
            if(time>=fromTime-.08) createTone(appleNotes[index],now+Math.max(0,time-fromTime),.13,.05,"sine");
          });
          [[22.5,523,.18],[22.65,659,.18],[22.8,784,.24]].forEach(([time,note,duration])=>{
            if(time>=fromTime-.08) createTone(note,now+Math.max(0,time-fromTime),duration,.04,"triangle");
          });
        }).catch(()=>{});
      }catch{}
    }

    function waitForAudioReady(){
      if(narration.readyState>=2) return Promise.resolve();
      return new Promise((resolve,reject)=>{
        const clean=()=>{
          narration.removeEventListener("loadeddata",onReady);
          narration.removeEventListener("canplay",onReady);
          narration.removeEventListener("error",onError);
        };
        const onReady=()=>{clean();resolve()};
        const onError=()=>{clean();reject(new Error("音频无法加载"))};
        narration.addEventListener("loadeddata",onReady,{once:true});
        narration.addEventListener("canplay",onReady,{once:true});
        narration.addEventListener("error",onError,{once:true});
      });
    }

    function loadAvatar(){
      return new Promise((resolve,reject)=>{
        const image=new Image();
        image.onload=()=>{
          if(image.decode) image.decode().catch(()=>{}).finally(resolve);
          else resolve();
        };
        image.onerror=()=>reject(new Error("头像无法加载"));
        image.src=AVATAR_URL;
      });
    }

    async function loadNarration(){
      let source=AUDIO_URL;
      try{
        const response=await fetch(AUDIO_URL,{cache:"force-cache"});
        if(!response.ok) throw new Error("音频下载失败");
        const blob=await response.blob();
        if(blob.size<1000) throw new Error("音频文件无效");
        if(audioObjectUrl) URL.revokeObjectURL(audioObjectUrl);
        audioObjectUrl=URL.createObjectURL(blob);
        source=audioObjectUrl;
      }catch(error){
        // file:// 本地打开时 fetch 可能被禁用，退回普通 audio 加载。
        source=AUDIO_URL;
      }
      narration.pause();
      narration.src=source;
      narration.load();
      await waitForAudioReady();
    }

    function withTimeout(promise,timeout){
      return Promise.race([
        promise,
        new Promise((_,reject)=>setTimeout(()=>reject(new Error("资源加载超时")),timeout))
      ]);
    }

    async function prepareResources(){
      if(preparingResources) return;
      preparingResources=true;
      resourcesReady=false;
      startTitle.textContent="苹果动画准备中";
      loadStatus.textContent="正在准备动画和声音…";
      loadStatus.classList.remove("error");
      startPlayButton.disabled=true;
      startPlayButton.textContent="资源加载中…";
      try{
        await withTimeout(Promise.all([loadAvatar(),loadNarration()]),RESOURCE_TIMEOUT);
        resourcesReady=true;
        startTitle.textContent="苹果动画准备好啦！";
        loadStatus.textContent="声音和画面已准备好";
        startPlayButton.disabled=false;
        startPlayButton.textContent="▶ 播放动画";
      }catch(error){
        startTitle.textContent="声音还没准备好";
        loadStatus.textContent="加载失败，请检查网络后重试";
        loadStatus.classList.add("error");
        startPlayButton.disabled=false;
        startPlayButton.textContent="↻ 重新加载声音";
      }finally{
        preparingResources=false;
      }
    }

    function resetAnimation(showStartPanel=true){
      stopAnimationSounds();
      narration.pause();
      try{narration.currentTime=0}catch{}
      stage.classList.remove("playing","paused");
      conclusion.classList.remove("show");
      actions.classList.remove("show");
      if(showStartPanel) startPanel.classList.remove("hide");
    }

    async function playAnimation(){
      if(playPending) return;
      if(!resourcesReady){
        prepareResources();
        return;
      }
      playPending=true;
      const panelWasVisible=!startPanel.classList.contains("hide");
      resetAnimation(panelWasVisible);
      loadStatus.textContent="正在开启声音…";
      loadStatus.classList.remove("error");
      startPlayButton.disabled=true;
      startPlayButton.textContent="正在播放…";
      try{
        if(window.AudioContext||window.webkitAudioContext){
          audioContext=audioContext||new(window.AudioContext||window.webkitAudioContext)();
          audioContext.resume().catch(()=>{});
        }
        await narration.play();
        startPanel.classList.add("hide");
        stage.classList.remove("playing","paused");
        conclusion.classList.remove("show");
        actions.classList.remove("show");
        void stage.offsetWidth;
        stage.classList.add("playing");
        playAnimationSounds(narration.currentTime);
      }catch(error){
        narration.pause();
        stage.classList.remove("playing","paused");
        startPanel.classList.remove("hide");
        loadStatus.textContent="浏览器没有播放声音，请再点一次";
        loadStatus.classList.add("error");
        startPlayButton.disabled=false;
        startPlayButton.textContent="🔊 点击重试";
      }finally{
        playPending=false;
      }
    }

    function finishAnimation(){
      stopAnimationSounds();
      stage.classList.remove("paused");
      conclusion.classList.add("show");
      actions.classList.add("show");
    }

    function returnToCoze(){
      resetAnimation(false);
      let cameFromCoze=false;
      try{cameFromCoze=/(^|\.)coze\.cn$/i.test(document.referrer ? new URL(document.referrer).hostname : "")}catch{}
      if(cameFromCoze && history.length>1){
        history.back();
        return;
      }
      if(window.opener){
        window.close();
        setTimeout(()=>{window.location.href=COZE_URL},350);
        return;
      }
      window.location.href=COZE_URL;
    }

    startPlayButton.addEventListener("click",playAnimation);
    document.getElementById("replayButton").addEventListener("click",playAnimation);
    narration.addEventListener("ended",finishAnimation);
    narration.addEventListener("waiting",()=>{
      if(!stage.classList.contains("playing")) return;
      stage.classList.add("paused");
      stopAnimationSounds();
    });
    narration.addEventListener("stalled",()=>{
      if(stage.classList.contains("playing")) stage.classList.add("paused");
      stopAnimationSounds();
    });
    narration.addEventListener("playing",()=>{
      if(!stage.classList.contains("playing")) return;
      stage.classList.remove("paused");
      playAnimationSounds(narration.currentTime);
    });
    document.querySelectorAll(".return-to-coze").forEach(button=>button.addEventListener("click",returnToCoze));
    window.addEventListener("pageshow",()=>{
      resetAnimation(true);
      if(resourcesReady){
        startTitle.textContent="苹果动画准备好啦！";
        loadStatus.textContent="声音和画面已准备好";
        loadStatus.classList.remove("error");
        startPlayButton.disabled=false;
        startPlayButton.textContent="▶ 播放动画";
      }
    });
    window.addEventListener("pagehide",()=>resetAnimation(false));
    window.addEventListener("beforeunload",()=>{
      if(audioObjectUrl) URL.revokeObjectURL(audioObjectUrl);
    });
    prepareResources();
  </script>
</body>
</html>
