    &lt;!-- 音频资源 --&gt;
    &lt;audio id=&quot;bgm-audio&quot; src=&quot;https://musk-online.fbcontent.cn/pub-musk-ai-studio/workflow/file/audio/K6CvH7JDzSEXMC5pWLpUCm.mp3&quot; preload=&quot;auto&quot;&gt;&lt;/audio&gt;

    &lt;script&gt;
        const CONFIG = {
            hookSpeed: 8,
            hookRotateSpeed: 0.02,
            hookMaxAngle: 75 * Math.PI / 180,
            ropeLength: 100,
            assets: {
                hook: 'https://musk-online.fbcontent.cn/pub-musk-ai-studio/workflow/file/picture/wGcr6GtCEg5r3kbyujYEx5.jpg',
                gold: 'https://musk-online.fbcontent.cn/pub-musk-ai-studio/workflow/file/picture/JgsVqkj9nENiKbFLrbfhb4.jpg',
                stone: 'https://musk-online.fbcontent.cn/pub-musk-ai-studio/workflow/file/picture/VGDYMNrhTVDCA77scsz39U.jpg',
                bag: 'https://musk-online.fbcontent.cn/pub-musk-ai-studio/workflow/file/picture/od24EUJfxSwkgHcXXmLyLM.jpg',
                bomb: 'https://musk-online.fbcontent.cn/pub-musk-ai-studio/workflow/file/picture/LhmCeS9B7quXRih24hA696.jpg'
            }
        };

        const STATE = { IDLE: 'IDLE', SHOOT: 'SHOOT', REWIND: 'REWIND', QUIZ: 'QUIZ', PAUSE: 'PAUSE' };

        class Game {
            constructor() {
                this.canvas = document.getElementById('game-canvas');
                this.ctx = this.canvas.getContext('2d');
                this.state = STATE.PAUSE;
                this.score = 0;
                this.targetScore = 300;
                this.timeLeft = 60;
                this.level = 1;
                this.items = [];
                this.particles = [];
                
                this.hook = {
                    x: 0, y: 100, angle: 0, length: CONFIG.ropeLength,
                    status: 'SWING', swingTime: 0, grabbedItem: null, speed: CONFIG.hookSpeed
                };

                this.images = {};
                this.loadAssets();
                this.audio = document.getElementById('bgm-audio');
                this.initEvents();
                this.resize();
                this.animate();
            }

            loadAssets() {
                Object.entries(CONFIG.assets).forEach(([key, src]) =&gt; {
                    const img = new Image();
                    img.src = src;
                    this.images[key] = img;
                });
            }

            resize() {
                this.width = window.innerWidth;
                this.height = window.innerHeight;
                this.canvas.width = this.width;
                this.canvas.height = this.height;
                this.hook.x = this.width / 2;
            }

            initEvents() {
                window.addEventListener('resize', () =&gt; this.resize());
                const handleAction = (e) =&gt; {
                    if (e.target.closest('.interactive-ui')) return;
                    if (this.state === STATE.IDLE) {
                        this.hook.status = 'SHOOT';
                        this.state = STATE.SHOOT;
                    }
                };
                window.addEventListener('mousedown', handleAction);
                window.addEventListener('touchstart', handleAction);

                document.getElementById('start-btn').onclick = () =&gt; {
                    this.startGame();
                    this.playAudio(0, 4); // 播放开场音效
                };
            }

            playAudio(start, duration) {
                try {
                    this.audio.currentTime = start;
                    this.audio.play();
                    setTimeout(() =&gt; {
                        this.audio.pause();
                    }, duration * 1000);
                } catch (e) {
                    console.log('Audio play failed', e);
                }
            }

            playCorrectSound() {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(500, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1000, ctx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.3, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.5);
            }

            playWrongSound() {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(200, ctx.currentTime);
                osc.frequency.linearRampToValueAtTime(100, ctx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.3, ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.3);
            }

            startGame() {
                this.score = 0;
                this.level = 1;
                this.startLevel();
                document.getElementById('overlay').classList.add('hidden');
            }

            startLevel() {
                this.state = STATE.IDLE;
                this.timeLeft = 60;
                this.targetScore = this.level * 300;
                this.hook.status = 'SWING';
                this.hook.length = CONFIG.ropeLength;
                this.hook.grabbedItem = null;
                this.initItems();
                this.updateUI();
                if (this.timer) clearInterval(this.timer);
                this.timer = setInterval(() =&gt; {
                    if (this.state !== STATE.PAUSE &amp;&amp; this.state !== STATE.QUIZ) {
                        this.timeLeft--;
                        document.getElementById('time-left').innerText = this.timeLeft;
                        if (this.timeLeft &lt;= 0) this.endLevel();
                    }
                }, 1000);
            }

            initItems() {
                this.items = [];
                const counts = { gold: 6, stone: 8, diamond: 3, bag: 2, bomb: 2 };
                Object.entries(counts).forEach(([type, count]) =&gt; {
                    for(let i=0; i&lt;count; i++) this.createItem(type);
                });
            }

            createItem(type) {
                let item = { type, rotation: Math.random() * Math.PI * 2 };
                let valid = false, attempts = 0;
                while(!valid &amp;&amp; attempts &lt; 50) {
                    item.x = 50 + Math.random() * (this.width - 100);
                    item.y = 250 + Math.random() * (this.height - 350);
                    item.radius = type === 'gold' ? 30 + Math.random()*30 : (type === 'stone' ? 40 + Math.random()*30 : 20);
                    item.score = type === 'gold' ? Math.floor(item.radius * 5) : (type === 'stone' ? 20 : (type === 'diamond' ? 200 : 50));
                    item.weight = type === 'stone' ? 3 : (type === 'gold' ? 1.5 : 1);
                    valid = !this.items.some(other =&gt; Math.hypot(item.x - other.x, item.y - other.y) &lt; item.radius + other.radius + 10);
                    attempts++;
                }
                if(valid) this.items.push(item);
            }

            generateQuiz() {
                const isAdd = Math.random() &gt; 0.5;
                let a, b, ans;
                if (isAdd) {
                    ans = Math.floor(Math.random() * 11); // 0-10
                    a = Math.floor(Math.random() * (ans + 1));
                    b = ans - a;
                } else {
                    a = Math.floor(Math.random() * 11); // 0-10
                    b = Math.floor(Math.random() * (a + 1));
                    ans = a - b;
                }
                let options = [ans];
                while(options.length &lt; 4) {
                    let fake = Math.floor(Math.random() * 11);
                    if(!options.includes(fake)) options.push(fake);
                }
                return { question: `\\(${a} ${isAdd ? '+' : '-'} ${b} = ?\\)`, answer: ans, options: options.sort(() =&gt; Math.random() - 0.5) };
            }

            showQuiz(item) {
                this.state = STATE.QUIZ;
                const modal = document.getElementById('quiz-modal');
                const quiz = this.generateQuiz();
                document.getElementById('question-text').innerHTML = quiz.question;
                if (window.MathJax) MathJax.typesetPromise();

                const container = document.getElementById('options-container');
                container.innerHTML = '';
                quiz.options.forEach(opt =&gt; {
                    const btn = document.createElement('button');
                    btn.className = &quot;bg-gray-100 hover:bg-blue-100 py-3 rounded-xl font-bold text-xl border-2 text-black&quot;;
                    btn.innerText = opt;
                    btn.onclick = () =&gt; this.handleAnswer(opt === quiz.answer, item);
                    container.appendChild(btn);
                });
                modal.classList.remove('hidden');
                anime({ targets: '#quiz-timer-bar', width: '0%', duration: 8000, easing: 'linear', complete: () =&gt; {
                    if(this.state === STATE.QUIZ) this.handleAnswer(false, item);
                }});
            }

            handleAnswer(correct, item) {
                document.getElementById('quiz-modal').classList.add('hidden');
                anime.remove('#quiz-timer-bar');
                if (correct) {
                    this.playCorrectSound();
                    this.score += item.score;
                    this.hook.speed = CONFIG.hookSpeed * 3;
                    this.showFloat(`+${item.score}`);
                } else {
                    this.playWrongSound();
                    this.hook.speed = 1;
                    this.showFloat('加油哦!', '#ff4444');
                }
                this.hook.status = 'REWIND';
                this.updateUI();
                this.state = STATE.REWIND;
            }

            showFloat(txt, color = '#FFD54F') {
                const el = document.createElement('div');
                el.className = 'fixed text-4xl font-bold z-50 pointer-events-none';
                el.style.color = color;
                el.style.left = '50%';
                el.style.top = '150px';
                el.innerText = txt;
                document.body.appendChild(el);
                anime({ targets: el, translateY: -100, opacity: 0, duration: 1000, easing: 'easeOutExpo', complete: () =&gt; el.remove() });
            }

            updateUI() {
                document.getElementById('current-score').innerText = this.score;
                document.getElementById('target-score').innerText = this.targetScore;
                document.getElementById('level-display').innerText = this.level;
            }

            endLevel() {
                clearInterval(this.timer);
                this.state = STATE.PAUSE;
                const overlay = document.getElementById('overlay');
                document.getElementById('overlay-title').innerText = this.score &gt;= this.targetScore ? &quot;过关啦！&quot; : &quot;再接再厉&quot;;
                document.getElementById('overlay-desc').innerText = `得分: ${this.score} / 目标: ${this.targetScore}`;
                document.getElementById('start-btn').innerText = this.score &gt;= this.targetScore ? &quot;下一关&quot; : &quot;重新开始&quot;;
                document.getElementById('start-btn').onclick = () =&gt; {
                    if(this.score &gt;= this.targetScore) this.level++;
                    else { this.level = 1; this.score = 0; }
                    this.startLevel();
                    overlay.classList.add('hidden');
                };
                overlay.classList.remove('hidden');
            }

            update() {
                if (this.state === STATE.PAUSE || this.state === STATE.QUIZ) return;
                if (this.hook.status === 'SWING') {
                    this.hook.swingTime += CONFIG.hookRotateSpeed;
                    this.hook.angle = Math.sin(this.hook.swingTime) * CONFIG.hookMaxAngle;
                } else if (this.hook.status === 'SHOOT') {
                    this.hook.length += CONFIG.hookSpeed;
                    const hx = this.hook.x + Math.sin(this.hook.angle) * this.hook.length;
                    const hy = this.hook.y + Math.cos(this.hook.angle) * this.hook.length;
                    if (hx &lt; 0 || hx &gt; this.width || hy &gt; this.height) {
                        this.hook.status = 'REWIND';
                        this.hook.speed = CONFIG.hookSpeed * 2;
                    }
                    for (let i = this.items.length - 1; i &gt;= 0; i--) {
                        const item = this.items[i];
                        if (Math.hypot(hx - item.x, hy - item.y) &lt; item.radius) {
                            this.hook.grabbedItem = this.items.splice(i, 1)[0];
                            this.showQuiz(this.hook.grabbedItem);
                            break;
                        }
                    }
                } else if (this.hook.status === 'REWIND') {
                    this.hook.length -= this.hook.speed;
                    if (this.hook.length &lt;= CONFIG.ropeLength) {
                        this.hook.length = CONFIG.ropeLength;
                        this.hook.status = 'SWING';
                        this.state = STATE.IDLE;
                        this.hook.grabbedItem = null;
                        this.hook.speed = CONFIG.hookSpeed;
                    }
                }
            }

            draw() {
                this.ctx.clearRect(0, 0, this.width, this.height);
                const ex = this.hook.x + Math.sin(this.hook.angle) * this.hook.length;
                const ey = this.hook.y + Math.cos(this.hook.angle) * this.hook.length;
                
                this.ctx.beginPath();
                this.ctx.moveTo(this.hook.x, this.hook.y);
                this.ctx.lineTo(ex, ey);
                this.ctx.lineWidth = 4;
                this.ctx.strokeStyle = '#4e342e';
                this.ctx.stroke();

                this.ctx.save();
                this.ctx.translate(ex, ey);
                this.ctx.rotate(-this.hook.angle);
                if (this.images.hook.complete) this.ctx.drawImage(this.images.hook, -20, -10, 40, 40);
                if (this.hook.grabbedItem) this.drawItem(this.hook.grabbedItem, 0, 20);
                this.ctx.restore();

                this.items.forEach(item =&gt; {
                    this.ctx.save();
                    this.ctx.translate(item.x, item.y);
                    this.ctx.rotate(item.rotation);
                    this.drawItem(item, 0, 0);
                    this.ctx.restore();
                });
            }

            drawItem(item, x, y) {
                const img = this.images[item.type];
                if (img &amp;&amp; img.complete) {
                    this.ctx.drawImage(img, x - item.radius, y - item.radius, item.radius * 2, item.radius * 2);
                } else {
                    this.ctx.fillStyle = item.type === 'gold' ? '#FFD54F' : '#9E9E9E';
                    this.ctx.beginPath();
                    this.ctx.arc(x, y, item.radius, 0, Math.PI * 2);
                    this.ctx.fill();
                }
            }

            animate() {
                this.update();
                this.draw();
                requestAnimationFrame(() =&gt; this.animate());
            }
        }

        window.onload = () =&gt; new Game();
    &lt;/script&gt;

  <script>

    function getIsMobile() {
      const width = document.documentElement.clientWidth
      const isMobile = /Android|webOS|iPhone|iPod|BlackBerry|iPad|Windows Phone|Mobile/i.test(navigator.userAgent) || width <= 768
      return isMobile
    }

    // 打开飞象老师官网
    function openFeixiangTeacher(event) {
      const isMobile = getIsMobile()

      // 判断是否为移动端浏览器
      if (isMobile) {
        // 移动端不跳转
        return
      }
      window.open('https://www.feixianglaoshi.com', '_blank')
    }


    // ==================== 埋点相关代码 ====================

    /**
     * 页面停留时长统计
     */
    (function () {
      let startTime = null
      let totalTime = 0
      let reportTimer = null // 防抖定时器

      // 开始计时
      function startTimer() {
        if (!startTime) {
          startTime = Date.now()
          console.log('[埋点] 开始计时')
        }
      }

      // 停止计时并累加时长
      function stopTimer() {
        if (startTime) {
          totalTime += Date.now() - startTime
          startTime = null
          console.log('[埋点] 停止计时，累计时长:', Math.floor(totalTime / 1000), '秒')
        }
      }

      // 检查页面是否真正可见
      function isPageVisible() {
        // 检查 document.hidden
        if (document.hidden) {
          return false
        }

        // 检查 document.visibilityState
        if (document.visibilityState && document.visibilityState !== 'visible') {
          return false
        }

        // 检查窗口是否有焦点
        if (!document.hasFocus()) {
          return false
        }

        return true
      }

      // 上报停留时长（带防抖）
      function reportStayTime(eventType, immediate = false) {
        stopTimer()

        // 清除之前的定时器
        if (reportTimer) {
          clearTimeout(reportTimer)
          reportTimer = null
        }

        // 如果是立即上报（如页面卸载），不使用防抖
        if (immediate) {
          doReport(eventType)
          return
        }

        // 使用防抖，避免短时间内多次上报
        // 100ms 内如果有多个事件触发，只上报最后一次
        reportTimer = setTimeout(function () {
          doReport(eventType)
          reportTimer = null
        }, 100)
      }

      // 实际执行上报
      function doReport(eventType) {
        if (window.frog && totalTime > 0) {
          const serverData = window.__SERVER_DATA__ || {}
          const chatId = serverData.watermarkChatId
          window.frog.add({
            url: '/time/HtmlPage/enter',
            eventId: 42818,
            customExtend: {
              chat_id: chatId,
              use_time: Math.floor(totalTime / 1000), // 转换为秒
            },
            duration: Math.floor(totalTime / 1000), // 转换为秒,
            currentPage: 'HtmlPage',
            eventAction: 'time',
            eventName: 'enter'
          })
          console.log(`[埋点] 页面停留时长上报 (${eventType}):`, Math.floor(totalTime / 1000), '秒')

          // 上报后重置累计时长，为下次统计做准备
          totalTime = 0
        }
      }

      // 清理函数：移除所有事件监听器
      function cleanup() {
        console.log('[埋点] 清理计时器资源')

        // 清除防抖定时器
        if (reportTimer) {
          clearTimeout(reportTimer)
          reportTimer = null
        }

        // 移除事件监听器
        document.removeEventListener('visibilitychange', handleVisibilityChange)
        window.removeEventListener('blur', handleBlur)
        window.removeEventListener('focus', handleFocus)
        window.removeEventListener('beforeunload', handleBeforeUnload)
        window.removeEventListener('pagehide', handlePageHide)

        // 重置变量
        startTime = null
        totalTime = 0
      }

      // 事件处理函数（需要命名以便移除）
      function handleVisibilityChange() {
        if (document.hidden) {
          // 页面不可见，停止计时并上报
          console.log('[埋点] visibilitychange - 页面隐藏')
          reportStayTime('visibilitychange')
        } else {
          // 页面可见，开始新的计时
          console.log('[埋点] visibilitychange - 页面显示，开始新的计时')
          startTimer()
        }
      }

      function handleBlur() {
        // 窗口失去焦点，停止计时并上报
        console.log('[埋点] blur - 窗口失去焦点')
        reportStayTime('blur')
      }

      function handleFocus() {
        // 窗口获得焦点，开始新的计时
        console.log('[埋点] focus - 窗口获得焦点，开始新的计时')
        startTimer()
      }

      function handleBeforeUnload() {
        // 页面卸载前立即上报（不使用防抖）
        console.log('[埋点] beforeunload - 页面即将卸载')
        reportStayTime('beforeunload', true)
        cleanup()
      }

      function handlePageHide() {
        // 页面隐藏时立即上报（iOS Safari 更可靠，不使用防抖）
        console.log('[埋点] pagehide - 页面隐藏')
        reportStayTime('pagehide', true)
      }

      function handleDOMContentLoaded() {
        if (isPageVisible()) {
          startTimer()
        }
      }

      // 监听页面可见性变化
      document.addEventListener('visibilitychange', handleVisibilityChange)

      // 监听窗口失去/获得焦点
      window.addEventListener('blur', handleBlur)
      window.addEventListener('focus', handleFocus)

      // 页面加载完成后开始计时
      if (document.readyState === 'loading') {
        window.addEventListener('DOMContentLoaded', handleDOMContentLoaded)
      } else {
        if (isPageVisible()) {
          startTimer()
        }
      }

      // 页面卸载时上报
      window.addEventListener('beforeunload', handleBeforeUnload)

      // 兼容性：监听 pagehide 事件（iOS Safari 更可靠）
      window.addEventListener('pagehide', handlePageHide)
    })()

    /**

     */
    function trackLogoClick(event) {
      // 阻止事件冒泡，避免触发 HTML 点击埋点
      event.stopPropagation()

      if (window.frog) {
        const serverData = window.__SERVER_DATA__ || {}
        const chatId = serverData.watermarkChatId
        console.log('trackHtmlClick', chatId)

        window.frog.add({
          url: '/click/HtmlPage/logo',
          eventId: 42816,
          customExtend: {
            chat_id: chatId,
          },
          currentPage: 'HtmlPage',
          eventAction: 'click',
          eventName: 'logo'
        })

        console.log('[埋点] 点击飞象老师 Logo')
      }
    }

    /**
     * 点击立即体验的埋点
     */
    function trackStartButtonClick(event) {
      // 阻止事件冒泡，避免触发 HTML 点击埋点
      event.stopPropagation()

      if (window.frog) {
        const serverData = window.__SERVER_DATA__ || {}
        const chatId = serverData.watermarkChatId
        console.log('trackHtmlClick', chatId)
        window.frog.add({
          url: '/click/HtmlPage/start',
          eventId: 42817,
          customExtend: {
            chat_id: chatId
          },
          currentPage: 'HtmlPage',
          eventAction: 'click',
          eventName: 'start'
        })
        console.log('[埋点] 点击立即体验')
      }
    }

    // 绑定点击事件
    document.addEventListener('DOMContentLoaded', function () {
      // 绑定 Logo 点击埋点和跳转功能
      const logoElement = document.querySelector('.left-watermark-content')
      if (logoElement) {
        logoElement.addEventListener('click', function (event) {
          trackLogoClick(event)
          openFeixiangTeacher(event)
        })
      }

      // 绑定立即体验按钮点击埋点和跳转功能
      const startButton = document.querySelector('.jump-button')
      if (startButton) {
        startButton.addEventListener('click', function (event) {
          trackStartButtonClick(event)
          openFeixiangTeacher(event)
        })
      }

      // 绑定水印覆盖层点击（整体区域）
      const watermarkOverlay = document.querySelector('.watermark-overlay')
      if (watermarkOverlay) {
        watermarkOverlay.addEventListener('click', function (event) {
          // 如果点击的不是 logo 或按钮，则触发跳转
          const target = event.target
          const isLogo = target.closest('.left-watermark-content')
          const isButton = target.closest('.jump-button')

          if (!isLogo && !isButton) {
            openFeixiangTeacher(event)
          }
        })
      }
    })

    // ==================== 原有功能代码 ====================

    function adjustRem() {
      const pcBaseWidth = 375 // 设计稿
      const width = document.documentElement.clientWidth
      document.documentElement.style.fontSize = `${(width / pcBaseWidth * 100).toFixed(2)}px`
    }


    // 移动端检测和按钮隐藏逻辑
    function checkAndHideButtonOnMobile() {
      const isMobile = getIsMobile()
      if (isMobile) {
        adjustRem()
      }
      const jumpButton = document.querySelector('.right-watermark-content .jump-button');
      const iframeContainer = document.querySelector('.iframe-container');

      if (isMobile && jumpButton) {
        jumpButton.style.display = 'none';
      } else {
        jumpButton.style.display = 'flex'
      }

      // 移动端时给iframe-container添加类名，否则移除类名
      if (iframeContainer) {
        if (isMobile) {
          iframeContainer.classList.add('mobile');
        } else {
          iframeContainer.classList.remove('mobile');
        }
      }
    }


    function handleResize() {
      // 响应式处理：重新检测移动端并处理按钮显示/隐藏
      checkAndHideButtonOnMobile();

      // 在窗口大小变化时，重新应用移动端相关的逻辑
      const isMobile = getIsMobile()
      const watermarkOverlay = document.querySelector('.watermark-overlay');
      const iframeContainer = document.querySelector('.iframe-container');

      // 根据当前设备类型调整水印覆盖层的点击行为
      if (watermarkOverlay) {
        if (isMobile) {
          // 移动端：移除点击事件或设置为空函数
          watermarkOverlay.onclick = function () {
            // 移动端不执行跳转
            return;
          };
        } else {
          // 桌面端：恢复正常的点击跳转功能
          watermarkOverlay.onclick = openFeixiangTeacher;
        }
      }

      // 确保在resize时也能正确添加或移除mobile类
      if (iframeContainer) {
        if (isMobile) {
          iframeContainer.classList.add('mobile');
        } else {
          iframeContainer.classList.remove('mobile');
        }
      }
    }

    // 防止iframe内容溢出
    window.addEventListener('resize', handleResize);

    // 页面加载完成后执行移动端检测
    document.addEventListener('DOMContentLoaded', checkAndHideButtonOnMobile);

    // 清理所有事件绑定的函数
    function clearAllEvents() {
      // 清除 resize 事件监听器
      window.removeEventListener('resize', handleResize);

      // 清除 DOMContentLoaded 事件监听器
      document.removeEventListener('DOMContentLoaded', checkAndHideButtonOnMobile);
    }

    // 页面卸载时自动清理事件（可选）
    window.addEventListener('beforeunload', clearAllEvents);

  </script>
</body>

</html>
